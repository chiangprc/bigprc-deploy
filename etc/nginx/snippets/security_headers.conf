# ============================================================
# BigPRC Security Headers
# Included in server block and any location that uses add_header
# (Nginx add_header inheritance: child replaces parent's add_header)
# ============================================================

# Prevent clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable browser XSS filter
add_header X-XSS-Protection "1; mode=block" always;

# Control Referer information sent to other sites
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy
# All CSS/JS is inline → requires unsafe-inline
# Clarity analytics loads from www.clarity.ms
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://www.clarity.ms; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

# Disable browser features we don't use
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
