<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script>
    (function(){
        var t=localStorage.getItem('theme');
        if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){
            document.documentElement.setAttribute('data-theme','dark');
        }
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BigPRC 极客资源索引{% endblock %}</title>
    <meta name="description" content="{% block description %}BigPRC 极客资源技术索引引擎 — 不存储文件，仅索引公开链接{% endblock %}">
    {% if canonical_url %}
    <link rel="canonical" href="{{ canonical_url }}">
    {% endif %}
    <link rel="search" type="application/opensearchdescription+xml" href="/opensearch.xml" title="BigPRC 资源索引">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9A%93</text></svg>">
    <!-- Open Graph -->
    <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}BigPRC 极客资源技术索引引擎{% endblock %}">
    <meta property="og:url" content="{{ canonical_url or 'https://www.bigprc.com' }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BigPRC">
    <meta property="og:locale" content="zh_CN">
    <meta name="twitter:card" content="summary">

    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --secondary: #666666;
            --border: #e5e5e5;
            --primary: #1a365d;
            --cta: #c0392b;
            --card-bg: #fafafa;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --secondary: #999999;
            --border: #2a2a2a;
            --primary: #5c9ce6;
            --cta: #e74c3c;
            --card-bg: #1a1a1a;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            line-height: 1.6; padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 2px; }

        /* scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        [data-theme="dark"] ::-webkit-scrollbar-thumb { background: #444; }
        * { scrollbar-width: thin; scrollbar-color: #ccc transparent; }
        [data-theme="dark"] * { scrollbar-color: #444 transparent; }

        /* top bar */
        nav.topbar {
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            height: 48px; background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 0;
        }
        nav.topbar a, nav.topbar button {
            padding: 12px 20px; font-size: 14px; line-height: 24px;
            color: var(--text); text-decoration: none;
            background: none; border: none; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        nav.topbar a:active, nav.topbar button:active {
            background: var(--card-bg); transition: background 0.1s;
        }

        .content { max-width: 860px; margin: 0 auto; padding: 40px 20px 60px; }
        .footer {
            text-align: center; padding: 30px 20px; font-size: 12px; color: var(--secondary);
            border-top: 1px solid var(--border);
        }
        .footer a { color: var(--secondary); }

        {% block extra_css %}{% endblock %}

        /* print */
        @media print {
            nav.topbar, .search-section, button, .cta-button, .download-box,
            .feedback-row, .related-box, .pagination, .footer {
                display: none !important;
            }
            body { color: #000; background: #fff; font-size: 12pt; line-height: 1.5; }
            a { text-decoration: underline; color: #000; }
            article a[href^="/"]::after {
                content: " (bigprc.com" attr(href) ")";
                font-size: 0.85em; color: #666;
            }
            h1 { font-size: 18pt; page-break-after: avoid; }
            .desc-box { border-left: 1px solid #ccc; background: none; padding-left: 12px; }
            @page { margin: 2cm; }
        }
    </style>
</head>
<body>

<nav class="topbar">
    <a href="/">BigPRC</a>
    <button id="themeToggle" onclick="toggleTheme()">亮色</button>
</nav>

{% block content %}{% endblock %}

<div class="footer">
    <p>BigPRC 极客资源技术索引引擎</p>
    <p>不存储任何实质文件 · 所有链接来自公开互联网 · <a href="mailto:{{ admin_email }}">DMCA / 商务合作</a></p>
    <p>&copy; 2026 BigPRC</p>
</div>

<script>
(function(){
    var btn = document.getElementById('themeToggle');
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    btn.textContent = isDark ? '暗色' : '亮色';
    btn.addEventListener('click', function() {
        var d = document.documentElement;
        var dark = d.getAttribute('data-theme') === 'dark';
        if (dark) {
            d.removeAttribute('data-theme');
            btn.textContent = '亮色';
            localStorage.setItem('theme','light');
        } else {
            d.setAttribute('data-theme','dark');
            btn.textContent = '暗色';
            localStorage.setItem('theme','dark');
        }
    });
})();

function trackEvent(name, data) {
    if (window.clarity) { try { clarity('event', name, data); } catch(e){} }
}
(function(){
    var m = location.search.match(/[?&]from=([^&]+)/);
    if (m && window.clarity) { try { clarity('set', 'source_page', m[1]); } catch(e){} }
})();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
