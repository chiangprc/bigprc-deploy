<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专题详情 — BigPRC 编辑工作台</title>
<style>
:root{--bg:#fff;--text:#1a1a1a;--sec:#666;--border:#e5e5e5;--primary:#1a6b4f;--card-bg:#fafafa;--red:#c5221f;--amber:#f0a030;--blue:#4285f4}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px}
.back{font-size:13px;margin-bottom:16px}
.back a{color:var(--primary)}
.header h1{font-size:22px;font-weight:700;margin:0}
.header .meta{font-size:13px;color:var(--sec);margin-top:4px}
.header .badges{display:flex;gap:8px;margin-top:8px}
.badge{padding:3px 12px;border-radius:10px;font-size:11px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.card{text-align:center;padding:16px;border-radius:8px;border:1px solid var(--border)}
.card .n{font-size:24px;font-weight:700;color:var(--primary)}
.card .l{font-size:12px;color:var(--sec);margin-top:2px}
.section{margin:24px 0}
.section h2{font-size:15px;font-weight:600;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:4px}
.rule-box{background:var(--card-bg);border:1px solid var(--border);border-radius:6px;padding:12px 16px;font-size:13px;font-family:monospace;white-space:pre-wrap;word-break:break-all}
.engine-summary{font-size:12px;color:var(--sec);margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
.engine-summary span{background:var(--card-bg);padding:3px 10px;border-radius:8px;border:1px solid var(--border)}
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px}
.tag-item{padding:3px 10px;border-radius:8px;font-size:12px;border:1px solid var(--border);color:var(--sec)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px;border-bottom:2px solid var(--border);color:var(--sec);font-size:11px;font-weight:600}
td{padding:7px 8px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--card-bg)}
summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--sec);padding:8px 0}
details{margin-bottom:8px}
.placeholder{color:var(--sec);font-style:italic;font-size:13px}
.error{text-align:center;padding:40px;color:var(--red)}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div class="back"><a href="/admin/collections.html">← 返回专题列表</a> &nbsp;·&nbsp; <a href="/admin/dashboard.html">工作台</a></div>
<div id="content"><div style="text-align:center;padding:40px;color:var(--sec)">加载中...</div></div>
</div>
<script>
var id = new URLSearchParams(location.search).get('id');
if(!id){document.getElementById('content').innerHTML='<div class=error>❌ 缺少 ?id= 参数</div>';}
else{
fetch('/admin/data/collection-details.json')
  .then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()})
  .then(function(data){
    var c = data.find(function(x){return x.id===id});
    if(!c){document.getElementById('content').innerHTML='<div class=error>❌ 未找到专题: '+id+'</div>';return}

    var qColor = function(k){ var m={'CORE':'#1a6b4f','SOLID':'#4285f4','NICHE':'#f0a030','THIN':'#ea4335','EMPTY':'#999'}; return m[k]||'#999'; };
    var hColor = function(k){ var m={'stable':'#1a6b4f','warning':'#f0a030','unstable':'#ea4335','empty':'#999','broken':'#c5221f'}; return m[k]||'#999'; };
    var ruleObj = c.rule||{};
    var ruleText = JSON.stringify(ruleObj, null, 2);

    var html = '<div class=header>'+
      '<h1>'+c.title+'</h1>'+
      '<div class=meta>'+c.id+(c.featured?' · ⭐ featured':'')+(c.auto_generated?' · auto':'')+'</div>'+
      '<div class=badges>'+
        '<span class=badge style="background:'+qColor(c.quality)+'20;color:'+qColor(c.quality)+'">'+c.quality+'</span>'+
        '<span class=badge style="background:'+hColor(c.health)+'20;color:'+hColor(c.health)+'">'+c.health+'</span>'+
      '</div></div>';

    html += '<div class=cards>'+
      '<div class=card><div class=n>'+c.resource_count+'</div><div class=l>资源</div></div>'+
      '<div class=card><div class=n>'+c.exclusive_count+'</div><div class=l>独占</div></div>'+
      '<div class=card><div class=n>'+c.shared_count+'</div><div class=l>共享</div></div>'+
      '<div class=card><div class=n>'+c.exclusive_pct+'%</div><div class=l>独占率</div></div>'+
      '</div>';

    // ── Rule Summary (自然语言, 默认展开) ──
    html += '<div class=section><h2>规则摘要</h2>';
    html += '<div style="border:1px solid var(--border);border-radius:6px;padding:16px;background:var(--card-bg)">';

    var hasTags = ruleObj.tags && ruleObj.tags.length;
    var hasTagsOr = ruleObj.tags_or && ruleObj.tags_or.length;
    var hasCats = ruleObj.cats && ruleObj.cats.length;
    var hasExclude = ruleObj.exclude_tags && ruleObj.exclude_tags.length;

    if(hasTags){
        html += '<div style="margin-bottom:12px"><span style="font-weight:600;font-size:13px">包含全部标签</span>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">';
        ruleObj.tags.forEach(function(t){html += '<span style="background:var(--bg);padding:3px 10px;border-radius:8px;font-size:12px;border:1px solid var(--border)">'+t+'</span>';});
        html += '</div></div>';
    }
    if(hasTagsOr){
        html += '<div style="margin-bottom:12px"><span style="font-weight:600;font-size:13px">包含任一标签</span>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">';
        ruleObj.tags_or.forEach(function(t){html += '<span style="background:var(--bg);padding:3px 10px;border-radius:8px;font-size:12px;border:1px solid var(--border)">'+t+'</span>';});
        html += '</div></div>';
    }
    if(hasCats){
        html += '<div style="margin-bottom:12px"><span style="font-weight:600;font-size:13px">分类限制</span>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">';
        ruleObj.cats.forEach(function(t){html += '<span style="background:var(--bg);padding:3px 10px;border-radius:8px;font-size:12px;border:1px solid var(--border)">'+t+'</span>';});
        html += '</div></div>';
    }
    if(hasExclude){
        html += '<div style="margin-bottom:12px"><span style="font-weight:600;font-size:13px">排除标签</span>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">';
        ruleObj.exclude_tags.forEach(function(t){html += '<span style="background:var(--bg);padding:3px 10px;border-radius:8px;font-size:12px;border:1px solid var(--border)">'+t+'</span>';});
        html += '</div></div>';
    }
    if(!hasTags && !hasTagsOr && !hasCats && !hasExclude){
        html += '<span style="color:var(--sec);font-size:13px">无规则约束 (匹配全部资源)</span>';
    }
    html += '</div></div>';

    // ── Rule Validation (match stats + tag/cat pools, 默认展开) ──
    html += '<div class=section><h2>匹配验证</h2>';
    html += '<div style="border:1px solid var(--border);border-radius:6px;padding:16px;background:var(--card-bg)">';

    var deltaIcon = c.health==='stable'?'🟢':c.health==='warning'?'🟡':'🔴';
    html += '<div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px">';
    html += '<div><span style="font-size:12px;color:var(--sec)">规则匹配</span><div style="font-size:20px;font-weight:700">'+c.engine_match+'</div></div>';
    html += '<div><span style="font-size:12px;color:var(--sec)">数据库</span><div style="font-size:20px;font-weight:700">'+c.resource_count+'</div></div>';
    html += '<div><span style="font-size:12px;color:var(--sec)">偏差</span><div style="font-size:20px;font-weight:700">'+c.engine_delta_pct+'%</div></div>';
    html += '<div><span style="font-size:12px;color:var(--sec)">状态</span><div style="font-size:20px">'+deltaIcon+'</div></div>';
    html += '</div>';

    var es = c.engine_summary||{};
    var tagsArr = es.tags||[];
    var tagsOrArr = es.tags_or||[];
    var catsArr = es.categories||[];
    if(tagsArr.length || tagsOrArr.length){
        html += '<div style="font-size:12px;color:var(--sec);margin-bottom:8px">标签池 (全站拥有该标签的资源总数)</div>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">';
        tagsArr.forEach(function(t){html += '<span style="background:var(--bg);padding:3px 10px;border-radius:8px;font-size:12px;border:1px solid var(--border)">'+t.name+': '+t.count+'</span>';});
        tagsOrArr.forEach(function(t){html += '<span style="background:var(--bg);padding:3px 10px;border-radius:8px;font-size:12px;border:1px dashed var(--border)">'+t.name+': '+t.count+'</span>';});
        html += '</div>';
    }
    if(catsArr.length){
        html += '<div style="font-size:12px;color:var(--sec);margin-bottom:8px">分类池 (全站该分类的资源总数)</div>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
        catsArr.forEach(function(t){html += '<span style="background:var(--bg);padding:3px 10px;border-radius:8px;font-size:12px;border:1px solid var(--border)">'+t.name+': '+t.count+'</span>';});
        html += '</div>';
    }
    html += '</div></div>';

    // ── Raw JSON (默认折叠) ──
    html += '<details><summary>查看规则 JSON</summary>';
    html += '<div class=rule-box style="margin-top:8px">'+ruleText+'</div></details>';

    // Top Tags
    if(c.top_tags && c.top_tags.length){
        html += '<div class=section><h2>Top Tags</h2><div class=tag-cloud>';
        c.top_tags.forEach(function(t){html += '<span class=tag-item>'+t.name+' ('+t.count+')</span>';});
        html += '</div></div>';
    }

    // Shared Collections
    if(c.shared_collections && c.shared_collections.length){
        html += '<div class=section><h2>共享专题</h2><table><tr><th>专题</th><th>共享</th><th>占比</th><th></th></tr>';
        c.shared_collections.forEach(function(s){
            html += '<tr><td>'+s.title+'</td><td>'+s.shared+'</td><td>'+s.shared_pct+'%</td><td><a href="/admin/collection-detail.html?id='+s.id+'">查看</a></td></tr>';
        });
        html += '</table></div>';
    }

    // Samples
    if(c.samples && c.samples.length){
        html += '<div class=section><h2>资源列表 ('+c.samples.length+' / '+c.resource_count+')</h2><table><tr><th>ID</th><th>标题</th><th>分类</th></tr>';
        c.samples.forEach(function(s){
            html += '<tr><td>'+s.id+'</td><td><a href="/go/'+s.id+'">'+s.title+'</a></td><td>'+s.category+'</td></tr>';
        });
        if(c.resource_count > 50) html += '<tr><td colspan=3 style="color:var(--sec)">... 仅展示前 50 条，共 '+c.resource_count+' 条</td></tr>';
        html += '</table></div>';
    }

    // Placeholder sections
    var placeholders = [
        {title:'Editor Notes', key:'editor_notes'},
        {title:'Recent Changes', key:'recent_changes'},
        {title:'AI Suggestion', key:'ai_suggestion'}
    ];
    placeholders.forEach(function(p){
        var val = c[p.key];
        html += '<details><summary>📝 '+p.title+'</summary>';
        if(val){html += '<div style="font-size:13px;color:var(--sec);padding:8px">'+val+'</div>';}
        else{html += '<div class=placeholder>暂无数据 (Phase 6.2 预留)</div>';}
        html += '</details>';
    });

    // Footer with prev/next nav
    var idx = data.indexOf(c);
    var prev = idx > 0 ? data[idx-1] : null;
    var next = idx < data.length-1 ? data[idx+1] : null;
    html += '<div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">';
    html += '<span>'+(prev?'<a href="?id='+prev.id+'" style="font-size:13px">← '+prev.title+'</a>':'')+'</span>';
    html += '<a href="/collection/'+c.id+'.html" style="color:var(--primary);font-size:13px">🌐 前台页面</a>';
    html += '<span>'+(next?'<a href="?id='+next.id+'" style="font-size:13px">'+next.title+' →</a>':'')+'</span>';
    html += '</div>';

    // Command hints
    html += '<div style="margin-top:12px;padding:12px 16px;background:var(--card-bg);border-radius:6px;border:1px solid var(--border)">';
    html += '<span style="font-size:12px;color:var(--sec);font-weight:500">💡 操作命令</span>';
    html += '<div style="font-size:11px;color:var(--sec);font-family:monospace;margin-top:6px;line-height:1.8">';
    html += 'python3 collection_faq.py<br>';
    html += 'python3 collection_editor_ai.py<br>';
    html += 'python3 auto_generate.py</div></div>';

    document.getElementById('content').innerHTML=html;
  })
  .catch(function(e){document.getElementById('content').innerHTML='<div class=error>❌ 加载失败: '+e.message+'<br><small>请先运行: python3 collection_dashboard_export.py</small></div>'});
}
</script>
</body>
</html>
