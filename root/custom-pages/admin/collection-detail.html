<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专题详情 — BigPRC 编辑工作台</title>
<link rel="stylesheet" href="/css/design-tokens.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="/js/icon-system.js"></script>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px}
.back{font-size:13px;margin-bottom:16px}
.back a{color:var(--primary)}
.header h1{font-size:22px;font-weight:700;margin:0}
.header .meta{font-size:13px;color:var(--sec);margin-top:4px}
.header .badges{display:flex;gap:8px;margin-top:8px}
/* .badge — defined in design-tokens.css */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.card{text-align:center;padding:var(--space-lg);border-radius:var(--radius-md);border:var(--border-width) solid var(--border);background:var(--color-surface);transition:border-color var(--transition-fast)}
.card .n{font-size:24px;font-weight:700;color:var(--primary)}
.card .l{font-size:12px;color:var(--sec);margin-top:2px}
.section{margin:24px 0}
.section h2{font-size:15px;font-weight:600;margin-bottom:10px;border-bottom:var(--border-width) solid var(--border);padding-bottom:4px}
.rule-box{background:var(--color-surface);border:var(--border-width) solid var(--border);border-radius:var(--radius-md);padding:var(--space-md) var(--space-lg);font-size:13px;font-family:var(--font-mono);white-space:pre-wrap;word-break:break-all}
.engine-summary{font-size:12px;color:var(--sec);margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
.engine-summary span{background:var(--color-surface);padding:3px 10px;border-radius:var(--radius-pill);border:var(--border-width) solid var(--border)}
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px}
/* .tag-item → .tag (defined in design-tokens.css) */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px;border-bottom:2px solid var(--border);color:var(--sec);font-size:11px;font-weight:600}
td{padding:7px 8px;border-bottom:var(--border-width) solid var(--border)}
tr:hover td{background:var(--card-bg)}
summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--sec);padding:8px 0}
details{margin-bottom:8px}
.placeholder{color:var(--sec);font-style:italic;font-size:13px}
.error{text-align:center;padding:40px;color:var(--red)}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div class="back"><a href="/admin/collections.html">← 返回专题列表</a> &nbsp;·&nbsp; <a href="/admin/dashboard.html">工作台</a></div>
<div id="content"><div style="text-align:center;padding:40px;color:var(--sec)">加载中...</div></div>
</div>
<script>
var id = new URLSearchParams(location.search).get('id');
if(!id){
    document.getElementById('content').innerHTML='<div style="text-align:center;padding:60px 20px">'+
      '<div style="font-size:48px;margin-bottom:16px"><i data-lucide="library" style="width:48px;height:48px" class="icon-muted"></i></div>'+
      '<div style="font-size:18px;font-weight:600;margin-bottom:8px;color:var(--text)">未选择专题</div>'+
      '<div style="font-size:14px;color:var(--sec);margin-bottom:24px">请先从「专题列表」选择一个专题进入</div>'+
      '<a href="/admin/collections.html" style="display:inline-block;padding:10px 24px;border:var(--border-width) solid var(--primary);border-radius:var(--radius-md);color:var(--primary);text-decoration:none;font-size:14px;font-weight:500">← 返回专题列表</a>'+
      '</div>';
}
else{
fetch('/admin/data/collection-details.json')
  .then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()})
  .then(function(data){
    var c = data.find(function(x){return x.id===id});
    if(!c){
        document.getElementById('content').innerHTML='<div style="text-align:center;padding:60px 20px">'+
          '<div style="font-size:48px;margin-bottom:16px"><i data-lucide="file-text" style="width:48px;height:48px" class="icon-muted"></i></div>'+
          '<div style="font-size:18px;font-weight:600;margin-bottom:8px;color:var(--text)">未找到专题</div>'+
          '<div style="font-size:14px;color:var(--sec);margin-bottom:4px">专题 ID：<span style="font-family:var(--font-mono);background:var(--color-surface);padding:2px 8px;border-radius:var(--radius-sm)">'+id+'</span></div>'+
          '<div style="font-size:12px;color:var(--sec);margin-bottom:24px;line-height:1.8">'+
          '可能原因：<br>· 专题已删除<br>· 数据尚未重新导出<br>· URL 输入错误</div>'+
          '<a href="/admin/collections.html" style="display:inline-block;padding:10px 24px;border:var(--border-width) solid var(--primary);border-radius:var(--radius-md);color:var(--primary);text-decoration:none;font-size:14px;font-weight:500">← 返回专题列表</a>'+
          '</div>';
        return;
    }

    var qColor = function(k){ var m={'CORE':'success','SOLID':'info','NICHE':'warning','THIN':'danger','EMPTY':'neutral'}; return m[k]||'neutral'; };
    var hColor = function(k){ var m={'stable':'success','warning':'warning','unstable':'danger','empty':'neutral','broken':'danger'}; return m[k]||'neutral'; };
    var ruleObj = c.rule||{};
    var ruleText = JSON.stringify(ruleObj, null, 2);

    var html = '<div class=header>'+
      '<h1>'+c.title+'</h1>'+
      '<div class=meta>'+c.id+(c.featured?' · '+BPRC.icon('featured_star',{color:'muted'})+' featured':'')+(c.auto_generated?' · auto':'')+'</div>'+
      '<div class=badges>'+
        '<span class="badge badge--'+qColor(c.quality)+'">'+c.quality+'</span>'+
        '<span class="badge badge--'+hColor(c.health)+'">'+c.health+'</span>'+
      '</div></div>';

    html += '<div class=cards>'+
      '<div class=card><div class=n>'+c.resource_count+'</div><div class=l>资源</div></div>'+
      '<div class=card><div class=n>'+c.exclusive_count+'</div><div class=l>独占</div></div>'+
      '<div class=card><div class=n>'+c.shared_count+'</div><div class=l>共享</div></div>'+
      '<div class=card><div class=n>'+c.exclusive_pct+'%</div><div class=l>独占率</div></div>'+
      '</div>';

    // ── Rule Summary (自然语言, 默认展开) ──
    html += '<div class=section><h2>规则摘要</h2>';
    html += '<div style="border:var(--border-width) solid var(--border);border-radius:var(--radius-md);padding:var(--space-lg);background:var(--color-surface)">';

    var hasTags = ruleObj.tags && ruleObj.tags.length;
    var hasTagsOr = ruleObj.tags_or && ruleObj.tags_or.length;
    var hasCats = ruleObj.cats && ruleObj.cats.length;
    var hasExclude = ruleObj.exclude_tags && ruleObj.exclude_tags.length;

    if(hasTags){
        html += '<div style="margin-bottom:12px"><span style="font-weight:600;font-size:13px">包含全部标签</span>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">';
        ruleObj.tags.forEach(function(t){html += '<span class="tag" style="background:var(--color-bg)">'+t+'</span>';});
        html += '</div></div>';
    }
    if(hasTagsOr){
        html += '<div style="margin-bottom:12px"><span style="font-weight:600;font-size:13px">包含任一标签</span>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">';
        ruleObj.tags_or.forEach(function(t){html += '<span class="tag" style="background:var(--color-bg)">'+t+'</span>';});
        html += '</div></div>';
    }
    if(hasCats){
        html += '<div style="margin-bottom:12px"><span style="font-weight:600;font-size:13px">分类限制</span>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">';
        ruleObj.cats.forEach(function(t){html += '<span class="tag" style="background:var(--color-bg)">'+t+'</span>';});
        html += '</div></div>';
    }
    if(hasExclude){
        html += '<div style="margin-bottom:12px"><span style="font-weight:600;font-size:13px">排除标签</span>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">';
        ruleObj.exclude_tags.forEach(function(t){html += '<span class="tag" style="background:var(--color-bg)">'+t+'</span>';});
        html += '</div></div>';
    }
    if(!hasTags && !hasTagsOr && !hasCats && !hasExclude){
        html += '<span style="color:var(--sec);font-size:13px">无规则约束 (匹配全部资源)</span>';
    }
    html += '</div></div>';

    // ── Rule Gap Evidence ──
    var gap = c.gap_evidence||{};
    var deltaIcon = c.health==='stable'?BPRC.icon('success',{color:'success'}):c.health==='warning'?BPRC.icon('warning',{color:'warning'}):BPRC.icon('danger',{color:'danger'});
    html += '<div class=section><h2>规则差距分析</h2>';
    html += '<div style="border:var(--border-width) solid var(--border);border-radius:var(--radius-md);padding:var(--space-lg);background:var(--color-surface)">';

    // Compact match stats row
    html += '<div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px">';
    html += '<div><span style="font-size:12px;color:var(--sec)">规则匹配</span><div style="font-size:20px;font-weight:700">'+c.engine_match+'</div></div>';
    html += '<div><span style="font-size:12px;color:var(--sec)">数据库</span><div style="font-size:20px;font-weight:700">'+c.resource_count+'</div></div>';
    html += '<div><span style="font-size:12px;color:var(--sec)">偏差</span><div style="font-size:20px;font-weight:700">'+c.engine_delta_pct+'%</div></div>';
    html += '<div><span style="font-size:12px;color:var(--sec)">状态</span><div style="font-size:20px">'+deltaIcon+'</div></div>';
    html += '</div>';

    if(gap.type==='under'){
        html += '<div style="background:var(--color-warning-soft);border:var(--border-width) solid var(--color-warning);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:12px">';
        html += '<div style="font-size:13px;font-weight:600;color:var(--color-warning);margin-bottom:4px">'+BPRC.icon('alert',{color:'warning'})+' 规则漏匹配 '+gap.missing_count+' 个资源</div>';
        html += '<div style="font-size:12px;color:var(--sec);margin-bottom:8px">以下标签在漏匹配资源中高频出现。建议评估是否加入 rule_json。</div>';
        gap.missing_tags.forEach(function(t){
            html += '<div style="margin-bottom:6px">';
            html += '<span style="font-weight:500;font-size:13px">'+t.name+'</span> <span style="font-size:11px;color:var(--sec)">('+t.count+' 次)</span>';
            if(t.preview && t.preview.added > 0){
                html += ' <span style="font-size:11px;color:var(--color-success);font-weight:500">预计 +'+t.preview.added+' 资源</span>';
            }
            html += '<div style="font-size:11px;color:var(--sec);margin-top:2px">例: '+t.samples.slice(0,3).join(' &middot; ')+'</div>';
            html += '</div>';
        });
        html += '<div style="font-size:10px;color:var(--sec);margin-top:8px;font-style:italic">※ 预计效果为单独加入该标签后的模拟结果，多个标签同时调整时结果可能不同。</div>';
        html += '</div>';
    } else if(gap.type==='over'){
        html += '<div style="background:var(--color-danger-soft);border:var(--border-width) solid var(--color-danger);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:12px">';
        html += '<div style="font-size:13px;font-weight:600;color:var(--color-danger);margin-bottom:4px">'+BPRC.icon('alert',{color:'danger'})+' 规则多匹配 '+gap.extra_count+' 个资源</div>';
        html += '<div style="font-size:12px;color:var(--sec);margin-bottom:8px">以下标签在多匹配资源中高频出现。建议评估是否通过 exclude_tags 排除。</div>';
        gap.extra_tags.forEach(function(t){
            html += '<div style="margin-bottom:6px">';
            html += '<span style="font-weight:500;font-size:13px">'+t.name+'</span> <span style="font-size:11px;color:var(--sec)">('+t.count+' 次)</span>';
            html += '<div style="font-size:11px;color:var(--sec);margin-top:2px">例: '+t.samples.slice(0,3).join(' &middot; ')+'</div>';
            html += '</div>';
        });
        html += '</div>';
    } else {
        html += '<div style="background:var(--color-success-soft);border-radius:var(--radius-md);padding:12px var(--space-lg)"><span style="font-size:13px;font-weight:500;color:var(--color-success)">'+BPRC.icon('complete',{color:'success'})+' 规则精确匹配，无差距</span></div>';
    }
    html += '</div></div>';

    // ── Raw JSON (默认折叠) ──
    html += '<details><summary>查看规则 JSON</summary>';
    html += '<div class=rule-box style="margin-top:8px">'+ruleText+'</div></details>';

    // Top Tags (compact, merged into end of Rule area)
    if(c.top_tags && c.top_tags.length){
        html += '<div class=section><h2>高频标签</h2><div class=tag-cloud>';
        c.top_tags.slice(0,10).forEach(function(t){html += '<span class=tag>'+t.name+' ('+t.count+')</span>';});
        html += '</div></div>';
    }

    // Shared Collections
    if(c.shared_collections && c.shared_collections.length){
        html += '<div class=section><h2>共享专题</h2><table><tr><th>专题</th><th>共享</th><th>占比</th><th></th></tr>';
        c.shared_collections.forEach(function(s){
            html += '<tr><td>'+s.title+'</td><td>'+s.shared+'</td><td>'+s.shared_pct+'%</td><td><a href="/admin/collection-detail.html?id='+s.id+'">查看</a></td></tr>';
        });
        html += '</table></div>';
    }

    // Samples
    if(c.samples && c.samples.length){
        html += '<div class=section><h2>资源列表 ('+c.samples.length+' / '+c.resource_count+')</h2><table><tr><th>ID</th><th>标题</th><th>分类</th></tr>';
        c.samples.forEach(function(s){
            html += '<tr><td>'+s.id+'</td><td><a href="/go/'+s.id+'">'+s.title+'</a></td><td>'+s.category+'</td></tr>';
        });
        if(c.resource_count > 10) html += '<tr><td colspan=3 style="color:var(--sec)">... 展示前 10 条，共 '+c.resource_count+' 条 · <a href="/list.html">查看全部</a></td></tr>';
        html += '</table></div>';
    }

    // Footer with prev/next nav
    var idx = data.indexOf(c);
    var prev = idx > 0 ? data[idx-1] : null;
    var next = idx < data.length-1 ? data[idx+1] : null;
    html += '<div style="margin-top:var(--space-2xl);padding-top:var(--space-lg);border-top:var(--border-width) solid var(--border);display:flex;justify-content:space-between;align-items:center">';
    html += '<span>'+(prev?'<a href="?id='+prev.id+'" style="font-size:13px">← '+prev.title+'</a>':'')+'</span>';
    html += '<a href="/collection/'+c.id+'.html" style="color:var(--primary);font-size:13px">'+BPRC.icon('site',{color:'muted'})+' 前台页面</a>';
    html += '<span>'+(next?'<a href="?id='+next.id+'" style="font-size:13px">'+next.title+' →</a>':'')+'</span>';
    html += '</div>';

    // ── Action Panel (context-aware) ──
    var actions = [];
    var gap = c.gap_evidence||{};
    if(gap.type==='under'){
        actions.push({icon:BPRC.icon('alert',{color:'warning'}),label:'规则漏匹配 '+gap.missing_count+' 个资源',
            detail:'查看上方「规则差距分析」，评估是否调整 rule_json',
            cmd:'python3 collection_rule_assist.py --preview '+c.id});
    }
    if(c.health==='unstable'){
        actions.push({icon:BPRC.icon('danger',{color:'danger'}),label:'规则状态异常 (unstable, Δ'+c.engine_delta_pct+'%)',
            detail:'规则匹配数与数据库记录偏差较大，建议重新导出确认',
            cmd:'python3 collection_dashboard_export.py'});
    }
    if(!c.content_complete){
        actions.push({icon:BPRC.icon('edit',{color:'muted'}),label:'专题内容待完善',
            detail:'缺少 intro、SEO 描述或 FAQ。运行内容生成脚本补全',
            cmd:'python3 collection_editor_ai.py && python3 collection_faq.py'});
    }
    if(actions.length===0){
        actions.push({icon:BPRC.icon('complete',{color:'success'}),label:'当前专题状态健康',
            detail:'规则精确匹配，内容完整。无需操作',
            cmd:null});
    }

    html += '<div class=section><h2>下一步操作</h2>';
    html += '<div style="border:var(--border-width) solid var(--border);border-radius:var(--radius-md);padding:var(--space-lg);background:var(--color-surface)">';
    actions.forEach(function(a){
        html += '<div style="margin-bottom:'+(a.cmd?'14px':'0')+'">';
        html += '<div style="font-size:13px;font-weight:600;margin-bottom:2px">'+a.icon+' '+a.label+'</div>';
        html += '<div style="font-size:12px;color:var(--sec)">'+a.detail+'</div>';
        if(a.cmd) html += '<div style="font-size:11px;color:var(--sec);font-family:monospace;margin-top:4px">'+BPRC.icon('cli',{color:'muted'})+' '+a.cmd+'</div>';
        html += '</div>';
    });
    html += '</div></div>';

    document.getElementById('content').innerHTML=html;
    lucide.createIcons();
  })
  .catch(function(e){document.getElementById('content').innerHTML='<div class=error><i data-lucide="x-circle" class="icon-sm icon-danger"></i> 加载失败: '+e.message+'<br><small>请先运行: python3 collection_dashboard_export.py</small></div>';lucide.createIcons()});
}
</script>
</body>
</html>
