<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专题管理 — BigPRC 编辑工作台</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.svg">
<link rel="stylesheet" href="/css/design-tokens.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
<script src="/js/icon-system.js"></script>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px}
h1{font-size:var(--text-section);font-weight:700;margin:0 0 4px}
.toolbar{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:6px var(--space-md);border:var(--border-width) solid var(--border);border-radius:var(--radius-md);font-size:var(--text-body);background:var(--bg);color:var(--text);font-family:inherit}
.toolbar input{flex:1;min-width:200px;max-width:300px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th{text-align:left;padding:10px 8px;border-bottom:2px solid var(--border);color:var(--sec);font-size:var(--text-caption);font-weight:600;cursor:pointer;user-select:none}
th:hover{color:var(--primary)}
th.sorted{color:var(--primary)}
td{padding:9px 8px;border-bottom:var(--border-width) solid var(--border)}
tr:hover td{background:var(--card-bg)}
/* .badge — defined in design-tokens.css */
.back{margin-top:20px;font-size:var(--text-body)}
.back a{color:var(--primary)}
.error{text-align:center;padding:40px;color:var(--color-danger)}
.none{text-align:center;padding:20px;color:var(--sec);font-size:var(--text-body)}
</style>
</head>
<body>
<div class="wrap">
<h1>专题管理</h1>
<p style="color:var(--sec);font-size:var(--text-body);margin:0">只读 · 点击表头排序 · 搜索/筛选过滤</p>
<div class="toolbar">
    <input type="text" id="search" placeholder="搜索标题或 ID..." oninput="render()">
    <select id="qFilter" onchange="render()">
        <option value="">全部质量</option>
        <option>CORE</option><option>SOLID</option><option>NICHE</option><option>THIN</option><option>EMPTY</option>
    </select>
    <select id="hFilter" onchange="render()">
        <option value="">全部健康</option>
        <option>stable</option><option>warning</option><option>unstable</option><option>empty</option><option>broken</option>
    </select>
</div>
<div id="content"><div style="text-align:center;padding:40px;color:var(--sec)">加载中...</div></div>
<div class="back"><a href="/admin/dashboard.html">← 返回工作台</a></div>
</div>
<script>
function editorialDot(id){
    var e=editorialMap[id];
    if(!e) return '<span title="no data">'+BPRC.icon('empty',{color:'neutral'})+'</span>';
    if(e.status=="complete") return '<span title="done">'+BPRC.icon('success',{color:'success'})+'</span>';
    if(e.status=="partial") return '<span title="partial">'+BPRC.icon('warning',{color:'warning'})+'</span>';
    return '<span title="empty">'+BPRC.icon('empty',{color:'neutral'})+'</span>';
}
function qColor(k){var m={'CORE':'success','SOLID':'info','NICHE':'warning','THIN':'danger','EMPTY':'neutral'};return m[k]||'neutral'}
function hColor(k){var m={'stable':'success','warning':'warning','unstable':'danger','empty':'neutral','broken':'danger'};return m[k]||'neutral'}
var allData=[], editorialMap={}, sortCol='resource_count', sortDir=-1;
function S(col){
    if(sortCol===col) sortDir*=-1; else{sortCol=col;sortDir=-1}
    document.querySelectorAll('th').forEach(function(t){t.className=(t.dataset.col===col?'sorted':'')});
    render();
}
function render(){
    var q=document.getElementById('search').value.toLowerCase();
    var qf=document.getElementById('qFilter').value;
    var hf=document.getElementById('hFilter').value;
    var list=allData.filter(function(c){
        if(qf&&c.quality!==qf)return false;
        if(hf&&c.health!==hf)return false;
        if(q){return c.title.toLowerCase().indexOf(q)>=0||c.id.toLowerCase().indexOf(q)>=0}
        return true;
    });
    list.sort(function(a,b){
        var va=a[sortCol],vb=b[sortCol];
        if(typeof va==='string') return sortDir*va.localeCompare(vb);
        return sortDir*(va-vb);
    });
    var html='<div class="table-wrap"><table><thead><tr>'+
        '<th data-col=title onclick=S("title")>标题</th>'+
        '<th data-col=resource_count onclick=S("resource_count") class=sorted>资源 ▾</th>'+
        '<th data-col=quality onclick=S("quality")>质量</th>'+
        '<th data-col=health onclick=S("health")>健康</th>'+
        '<th></th></tr></thead><tbody>';
    if(!list.length){html+='<tr><td colspan=5 class=none>无匹配结果</td></tr>'}
    list.forEach(function(c){
        html+='<tr>'+
          '<td><b>'+c.title+'</b> <span style="font-size:var(--text-caption);color:var(--sec)">'+c.id+'</span></td>'+
          '<td>'+c.resource_count+'</td>'+
          '<td><span class="badge badge--'+qColor(c.quality)+'">'+c.quality+'</span></td>'+
          '<td><span class="badge badge--'+hColor(c.health)+'">'+c.health+'</span></td>'+
          '<td>'+editorialDot(c.id)+'</td><td><a href="/admin/collection-detail.html?id='+c.id+'">详情 →</a></td>'+
          '</tr>';
    });
    html+='</tbody></table></div>';
    document.getElementById('content').innerHTML=html;
}
fetch('/admin/data/collections.json')
  .then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()})
  .then(function(d){allData=d;return fetch('/admin/data/editorial.json').then(function(r){return r.json()}).then(function(e){if(e&&e.collections)e.collections.forEach(function(x){editorialMap[x.id]=x})})}).then(function(){render();if(typeof lucide!=='undefined')lucide.createIcons()})
  .catch(function(e){document.getElementById('content').innerHTML='<div class=error><i data-lucide="x-circle" class="icon-sm icon-danger"></i> 加载失败: '+e.message+'<br><small>python3 collection_dashboard_export.py</small></div>';if(typeof lucide!=='undefined')lucide.createIcons()});
</script>
</body>
</html>
