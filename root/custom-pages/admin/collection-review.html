<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection Review — BigPRC 编辑部</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.svg">
<link rel="stylesheet" href="/css/design-tokens.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
<script src="/js/icon-system.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
h1{font-size:22px;font-weight:700;margin-bottom:4px}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}
.sum-item{text-align:center;padding:var(--space-lg);border-radius:var(--radius-md);border:var(--border-width) solid var(--border);background:var(--color-surface)}
.sum-item .n{font-size:28px;font-weight:700;color:var(--primary)}
.sum-item .l{font-size:12px;color:var(--sec);margin-top:2px}
.filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.filters button{padding:6px var(--space-lg);border:var(--border-width) solid var(--border);border-radius:var(--radius-pill);font-size:var(--text-body);cursor:pointer;background:var(--bg);color:var(--text);font-family:inherit}
.filters button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.card{border:var(--border-width) solid var(--border);border-radius:var(--radius-md);padding:18px var(--space-xl);margin-bottom:var(--space-md);background:var(--color-surface);transition:border-color var(--transition-fast)}
.card:hover{border-color:var(--color-accent)}
.card .hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card .hdr .tags{font-size:var(--text-subtitle);font-weight:600}
/* .card .hdr .action — now uses .badge from design-tokens.css */
.card .meta{font-size:var(--text-body);color:var(--sec);margin-bottom:6px;line-height:1.6}
.card .reason{font-size:12px;color:var(--sec);font-style:italic}
.card .details{display:none;margin-top:12px;padding-top:12px;border-top:var(--border-width) solid var(--border)}
.card .details.open{display:block}
.card .toggle{font-size:12px;color:var(--primary);cursor:pointer;margin-top:6px;display:inline-block}
.card .toggle:hover{text-decoration:underline}
.sample-table{width:100%;font-size:12px;border-collapse:collapse;margin-top:8px}
.sample-table th{text-align:left;padding:6px 8px;border-bottom:var(--border-width) solid var(--border);color:var(--sec);font-weight:500}
.sample-table td{padding:6px 8px;border-bottom:var(--border-width) solid var(--border)}
.loading{text-align:center;padding:40px;color:var(--sec)}
.error{text-align:center;padding:40px;color:var(--color-danger)}
@media(max-width:600px){.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>Collection Review</h1>
<p style="color:var(--sec);font-size:var(--text-body)">专题发现审核面板 · 只读</p>
<div class="summary" id="summary"></div>
<div class="filters" id="filters"></div>
<div id="content"><div class="loading">加载中...</div></div>
</div>
<script>
var allGroups = [], currentFilter = 'ALL', currentSort = 'match';

function actionClass(a) {
    var m = {'KEEP':'success','EXPAND_RULE':'warning','NEW_COLLECTION':'info','MERGE_REVIEW':'danger'};
    return m[a] || 'neutral';
}

function renderSummary(d) {
    document.getElementById('summary').innerHTML =
        '<div class=sum-item><div class=n>'+d.total_groups+'</div><div class=l>发现</div></div>' +
        '<div class=sum-item><div class=n>'+(d.summary.KEEP||0)+'</div><div class=l>已覆盖</div></div>' +
        '<div class=sum-item><div class=n>'+(d.summary.EXPAND_RULE||0)+'</div><div class=l>优化规则</div></div>' +
        '<div class=sum-item><div class=n>'+(d.summary.NEW_COLLECTION||0)+'</div><div class=l>新专题候选</div></div>';

    var fs = '<button class="active" onclick=F("ALL")>全部 ('+d.total_groups+')</button>';
    fs += '<button onclick=F("KEEP")>'+BPRC.icon('complete',{color:'success'})+' 已覆盖 ('+(d.summary.KEEP||0)+')</button>';
    fs += '<button onclick=F("EXPAND_RULE")">'+BPRC.icon('optimize',{color:'muted'})+' 优化规则 ('+(d.summary.EXPAND_RULE||0)+')</button>';
    fs += '<button onclick=F("NEW_COLLECTION")">'+BPRC.icon('new_item',{color:'muted'})+' 新候选 ('+(d.summary.NEW_COLLECTION||0)+')</button>';
    fs += '<button onclick=F("MERGE_REVIEW")">'+BPRC.icon('merge',{color:'muted'})+' 重叠 ('+(d.summary.MERGE_REVIEW||0)+')</button>';
    document.getElementById('filters').innerHTML = fs;
}

function F(filter) {
    currentFilter = filter;
    var btns = document.querySelectorAll('.filters button');
    btns.forEach(function(b){b.className=(b.textContent.indexOf(filter)>=0||(filter==='ALL'&&b.textContent.indexOf('全部')>=0))?'active':''});
    renderCards();
}

function S(sort) {
    currentSort = sort;
    var btns = document.querySelectorAll('.sort-row button');
    btns.forEach(function(b){b.className = b.textContent.indexOf(sort==='match'?'发现':sort==='uncovered'?'未覆盖':'覆盖率')>=0 ? 'active' : ''});
    renderCards();
}

function renderCards() {
    var groups = currentFilter === 'ALL' ? allGroups.slice() : allGroups.filter(function(g){return g.action===currentFilter});
    if (currentSort === 'uncovered') groups.sort(function(a,b){return b.uncovered_count - a.uncovered_count});
    else if (currentSort === 'coverage') groups.sort(function(a,b){return a.coverage_pct - b.coverage_pct});
    else groups.sort(function(a,b){return b.match_count - a.match_count});

    var h = '<div class="sort-row filters" style="margin-bottom:12px">' +
        '<span style="font-size:12px;color:var(--sec);padding:6px 8px 6px 0">排序:</span>' +
        '<button class="'+(currentSort==='match'?'active':'')+'" onclick=S("match")">发现数量 ↓</button>' +
        '<button class="'+(currentSort==='uncovered'?'active':'')+'" onclick=S("uncovered")">未覆盖数量 ↓</button>' +
        '<button class="'+(currentSort==='coverage'?'active':'')+'" onclick=S("coverage")">覆盖率 ↑</button>' +
        '</div>';
    groups.forEach(function(g){
        var tags = g.candidate_tags.join(' ');
        h += '<div class="card '+g.action+'">' +
            '<div class=hdr><span class=tags>'+tags+'</span><span class="badge badge--'+actionClass(g.action)+'">'+g.action_label+'</span></div>' +
            '<div class=meta>发现 <b>'+g.match_count+'</b> 条 · 覆盖 <b>'+g.covered_count+'</b> 条 · 未覆盖 <b>'+g.uncovered_count+'</b> 条 · 覆盖率 <b>'+g.coverage_pct+'%</b></div>' +
            '<div class=meta>最佳匹配: <b>'+(g.best_match?g.best_match.title:'—')+'</b>'+(g.best_match?' ('+g.best_match.covered_count+' 条)':'')+'</div>';
        if (g.representative_tags && g.representative_tags.length) {
            h += '<div class=meta style="font-size:12px;color:var(--sec)">标签: '+g.representative_tags.slice(0,8).join(' · ')+'</div>';
        }
        h += '<div class=reason>'+g.reason+'</div>';
        if (g.group_id && g.action !== 'KEEP') {
            h += '<div style="font-size:11px;color:var(--sec);margin-top:4px;font-family:monospace">'+BPRC.icon('cli',{color:'muted'})+' python3 collection_rule_assist.py --preview '+g.group_id+'</div>';
        }
        if (g.top_matches && g.top_matches.length >= 2 && g.action === 'MERGE_REVIEW') {
            h += '<div style="font-size:12px;color:var(--sec);margin-top:4px;">';
            g.top_matches.forEach(function(m){h += m.title + ' (' + m.covered_count + ') · ';});
            h += '</div>';
        }
        if (g.resource_samples && g.resource_samples.length > 0) {
            h += '<span class=toggle onclick="T(this)">'+BPRC.icon('expand',{color:'muted'})+' 查看资源 ('+g.match_count+' 条)</span>';
            h += '<div class=details><div class="table-wrap"><table class=sample-table><tr><th></th><th>ID</th><th>标题</th><th>当前所属专题</th></tr>';
            g.resource_samples.forEach(function(s){
                var dot = s.covered ? '<span style="color:var(--color-success);font-weight:700">●</span>' : '<span style="color:var(--color-danger);font-weight:700">●</span>';
                var colls = s.collections && s.collections.length ? s.collections.map(function(c){return c.title}).join(', ') : (s.covered ? '—' : '<span style="color:var(--color-danger)">未归属</span>');
                h += '<tr><td>'+dot+'</td><td>'+s.id+'</td><td><a href="/go/'+s.id+'">'+s.title+'</a></td><td>'+colls+'</td></tr>';
            });
            if (g.match_count > 20) h += '<tr><td colspan=4 style="color:var(--sec)">... 仅展示前 20 条，共 '+g.match_count+' 条</td></tr>';
            h += '</table></div></div>';
        }
        h += '</div>';
    });
    document.getElementById('content').innerHTML = h || '<div class=loading>无匹配结果</div>';
if(typeof lucide!=='undefined')lucide.createIcons();
}

function T(el) {
    var d = el.nextElementSibling;
    var open = d.className.indexOf('open') >= 0;
    d.className = open ? 'details' : 'details open';
    el.innerHTML = open ? BPRC.icon('expand',{color:'muted'})+' 查看资源 (' + (el.textContent.match(/\d+/)||[0])[0] + ' 条)' : BPRC.icon('collapse',{color:'muted'})+' 收起资源';
}

fetch('/admin/data/review-data.json')
    .then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()})
    .then(function(d){allGroups=d.groups;renderSummary(d);renderCards()})
    .catch(function(e){document.getElementById('content').innerHTML='<div class=error><i data-lucide="x-circle" class="icon-sm icon-danger"></i> 加载失败: '+e.message+'<br><small>请先运行: python3 collection_review_export.py</small></div>';if(typeof lucide!=='undefined')lucide.createIcons()});
</script>
</body>
</html>
