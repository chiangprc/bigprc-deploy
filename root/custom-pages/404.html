<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script>
    (function(){
        var t=localStorage.getItem('theme');
        if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){
            document.documentElement.setAttribute('data-theme','dark');
        }
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - BigPRC</title>
    <style>
        :root { --bg: #ffffff; --text: #1a1a1a; --secondary: #666666; --border: #e5e5e5; --primary: #1a365d; --card-bg: #fafafa; }
        [data-theme="dark"] { --bg: #121212; --text: #e0e0e0; --secondary: #999999; --border: #2a2a2a; --primary: #5c9ce6; --card-bg: #1a1a1a; }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        nav.topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            height: 48px; background: var(--bg); border-bottom: 1px solid var(--border);
        }
        nav.topbar a, nav.topbar button {
            padding: 12px 20px; font-size: 14px; line-height: 24px;
            color: var(--text); text-decoration: none; background: none; border: none; cursor: pointer;
        }
        nav.topbar a:active, nav.topbar button:active { background: var(--card-bg); }

        h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
        p { font-size: 13px; color: var(--secondary); margin-bottom: 28px; }
        a.btn {
            display: inline-block; padding: 10px 24px; border: 1px solid var(--border);
            border-radius: 4px; font-size: 13px; color: var(--text); text-decoration: none;
            margin: 0 6px; transition: border-color 0.15s;
        }
        a.btn:hover { border-color: var(--primary); color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

<nav class="topbar">
    <a href="/">BigPRC</a>
    <button id="themeToggle">亮色</button>
</nav>

<h1>页面未找到</h1>
<p>该页面可能已被移除，或链接地址有误</p>
<div>
    <a href="/" class="btn">返回首页</a>
    <a href="/list.html" class="btn">资源列表</a>
</div>

<script>
(function(){
    var btn = document.getElementById('themeToggle');
    var isDark = document.documentElement.getAttribute('data-theme')==='dark';
    btn.textContent = isDark?'暗色':'亮色';
    btn.addEventListener('click',function(){
        var d=document.documentElement;
        var dark=d.getAttribute('data-theme')==='dark';
        if(dark){ d.removeAttribute('data-theme'); btn.textContent='亮色'; localStorage.setItem('theme','light'); }
        else { d.setAttribute('data-theme','dark'); btn.textContent='暗色'; localStorage.setItem('theme','dark'); }
    });
})();
</script>
</body>
</html>
