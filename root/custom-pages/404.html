<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | BigPRC</title>
    <style>
        :root { --primary: #1a365d; --bg: #f8f9fa; --text: #333; --card-bg: #ffffff; --border: rgba(128,128,128,0.15); }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; transition: background 0.3s, color 0.3s; }

        .float-btn { position: fixed; top: 20px; z-index: 999; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 1px solid #ddd; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; color: #555; text-decoration: none; transition: all 0.3s; }
        .float-btn:hover { box-shadow: 0 4px 10px rgba(0,0,0,0.12); transform: scale(1.05); color: var(--primary); }
        .home-btn { left: 20px; }
        .theme-btn { right: 20px; }

        .error-container { text-align: center; max-width: 500px; }
        .error-code { font-size: 6rem; font-weight: 800; color: var(--primary); margin: 0; line-height: 1; opacity: 0.15; }
        .error-icon { font-size: 3rem; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; color: var(--primary); margin: 0 0 10px; font-weight: 600; }
        p { font-size: 0.95rem; opacity: 0.6; margin: 0 0 30px; line-height: 1.6; }

        .actions { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn { display: inline-block; padding: 12px 28px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,54,93,0.3); }
        .btn-outline { border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: #fff; }

        body.dark-mode { --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --primary: #5c9ce6; --border: #333; }
        .dark-mode .error-code { opacity: 0.08; }
        .dark-mode .float-btn { background: #2a2a2a; border-color: #444; color: #e0e0e0; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
        .dark-mode .float-btn:hover { color: var(--primary); }
        .dark-mode .btn-outline:hover { color: #fff; }
    </style>
</head>
<body>
    <a href="/" class="float-btn home-btn" title="返回主页">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <button id="themeToggleBtn" class="float-btn theme-btn" onclick="toggleTheme()" title="切换亮暗色"></button>

    <div class="error-container">
        <div class="error-icon">🚫</div>
        <h1>页面未找到</h1>
        <p>该页面可能已被移除、链接地址有误<br>或资源已下架</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">返回首页</a>
            <a href="/list.html" class="btn btn-outline">浏览资源列表</a>
        </div>
    </div>

    <script>
        var sunSvg = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
        var moonSvg = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
        if(window.localStorage && localStorage.getItem("theme") === "dark") document.body.className += " dark-mode";
        function toggleTheme() {
            var body = document.body, btn = document.getElementById("themeToggleBtn");
            if (body.className.indexOf("dark-mode") > -1) {
                body.className = body.className.replace("dark-mode", "").trim();
                btn.innerHTML = moonSvg; if(window.localStorage) localStorage.setItem("theme", "light");
            } else {
                body.className += " dark-mode";
                btn.innerHTML = sunSvg; if(window.localStorage) localStorage.setItem("theme", "dark");
            }
        }
        window.addEventListener('DOMContentLoaded', function() {
            var btn = document.getElementById("themeToggleBtn");
            if(btn) btn.innerHTML = document.body.className.indexOf("dark-mode") > -1 ? sunSvg : moonSvg;
        });
    </script>
</body>
</html>
