        .card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 15px 30px rgba(0,0,0,0.1); color: var(--primary); }
        .card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary); opacity: 0; transition: opacity 0.3s; }
        .card:hover::before { opacity: 1; }
        
        .card .icon { margin-bottom: 25px; display: flex; align-items: center; justify-content: center; transition: color 0.3s; }
        .card h3 { margin: 0 0 15px; color: var(--primary); font-size: 1.4rem; }
        .card p { font-size: 0.95rem; opacity: 0.7; line-height: 1.6; margin: 0; color: var(--text); }

        .disabled-card { opacity: 0.5; cursor: not-allowed; filter: grayscale(100%); }

        body.dark-mode { --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --primary: #5c9ce6; --border: #333; }
        .dark-mode .hero { background: linear-gradient(to bottom, rgba(92,156,230,0.05), transparent); }

        if(window.localStorage && localStorage.getItem("theme") === "dark") document.body.className += " dark-mode";
        function toggleTheme() {
            var body = document.body, btn = document.getElementById("themeToggleBtn");
            if (body.className.indexOf("dark-mode") > -1) {
                body.className = body.className.replace("dark-mode", "").trim();

        window.addEventListener('DOMContentLoaded', function() {

        });
    </script>
