<script>
(function(){
    // theme toggle
    var btn = document.getElementById('themeToggle');
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    btn.textContent = isDark ? '暗色' : '亮色';
    btn.addEventListener('click', function(){
        var d = document.documentElement;
        var dark = d.getAttribute('data-theme') === 'dark';
        if(dark){ d.removeAttribute('data-theme'); btn.textContent='亮色'; localStorage.setItem('theme','light'); }
        else { d.setAttribute('data-theme','dark'); btn.textContent='暗色'; localStorage.setItem('theme','dark'); }
    });

    // data
    var allItems = [];
    var input = document.getElementById('searchInput');
    var results = document.getElementById('results');
    var tags = document.getElementById('tags');
    var wrap = document.getElementById('searchWrap');
    var cancel = document.getElementById('cancelBtn');

    // fetch index.json
    fetch('/index.json')
        .then(function(r){ return r.json(); })
        .then(function(data){
            allItems = data;
            input.placeholder = '搜索 ' + data.length + ' 项资源...';
            buildTags(data);
        })
        .catch(function(){});

    function buildTags(data){
        var cats = {};
        data.forEach(function(r){ if(r.category) cats[r.category] = (cats[r.category]||0)+1; });
        var keys = Object.keys(cats).sort();
        keys.forEach(function(c){
            var a = document.createElement('a');
            a.href = '/list.html'; a.textContent = c + ' (' + cats[c] + ')';
            a.addEventListener('click', function(e){ e.preventDefault(); window.location='/list.html?q='+encodeURIComponent(c); });
            tags.appendChild(a);
        });
    }

    function search(q){
        if(!q || q.length < 1){ results.className='results'; results.innerHTML=''; return; }
        var lq = q.toLowerCase();
        var matches = allItems.filter(function(r){ return r.title.toLowerCase().indexOf(lq) > -1; }).slice(0, 8);
        results.className = matches.length ? 'results has-items' : 'results';
        if(matches.length === 0 && q.length >= 2){
            results.innerHTML = '<div class="empty">未找到匹配项</div>';
            results.className = 'results has-items';
            return;
        }
        var html = '';
        matches.forEach(function(r){
            var meta = [r.size, r.category].filter(Boolean).join(' &middot; ');
            html += '<a class="item" href="/go/'+r.id+'?from=search"><span class="name">'+esc(r.title)+'</span><span class="meta">'+esc(meta||'')+'</span></a>';
        });
        results.innerHTML = html;
    }

    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // events
    var timer;
    input.addEventListener('input', function(){
        clearTimeout(timer);
        var self = this;
        timer = setTimeout(function(){ search(self.value); }, 200);
    });
    input.addEventListener('focus', function(){
        if(window.innerWidth <= 768){
            document.body.classList.add('is-searching');
            window.history.pushState({search:true}, '');
        }
        if(this.value) search(this.value);
    });
    input.addEventListener('keydown', function(e){ if(e.key==='Escape'){ this.value=''; closeSearch(); } });

    cancel.addEventListener('click', closeSearch);

    function closeSearch(){
        input.value = ''; results.className = 'results'; results.innerHTML = '';
        document.body.classList.remove('is-searching');
        input.blur();
    }

    window.addEventListener('popstate', function(e){
        if(document.body.classList.contains('is-searching')){
            closeSearch();
            e.preventDefault();
        }
    });

    // click outside to close (desktop)
    document.addEventListener('click', function(e){
        if(!wrap.contains(e.target) && window.innerWidth > 768){
            results.className = 'results'; results.innerHTML = '';
        }
    });

    // clarity
    var _ct;
    input.addEventListener('input', function(){
        clearTimeout(_ct);
        var v = input.value;
        _ct = setTimeout(function(){
            if(window.clarity && v.length >= 2){ try{clarity('event','search',v);}catch(e){} }
        }, 1500);
    });
})();
</script>
